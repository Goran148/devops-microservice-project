name: CI Pipeline - Build and Push Docker Images

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

env:
    REGISTRY: ghcr.io
    BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
    FRONTED_IMAGE_NAME: ${{ github.repository }}/fronted

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            # 1. preuzimanje koda iz repozitorijuma
            -  name: Checkout repository
               uses: actions/checkout@v4

            # 2. Login na Github container registry GHCR
            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            # 3. Postavljanje Docker Buildx-a za napredno keshiranje
            - name: Seut up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 4. Build and push za Backend
            - name: Build and Push Backend Image
              uses: docker/build-push-action@v5
              with:
                context: ./backend
                push: ${{ github.ref == 'refs/heads/main' }}
                tags: |
                  ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
                  ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

            # 5. Build and Push za Fronted
            - name: Build and Push Fronted Image
              uses: docker/build-push-action@v5
              with:
                context: ./fronted
                push: ${{ github.ref == 'refs/heads/main' }}
                tags: |
                  ${{ env.REGISTRY }}/${{ env.FRONTED_IMAGE_NAME }}:latest
                  ${{ env.REGISTRY }}/${{ env.FRONTED_IMAGE_NAME }}:${{ github.sha }}